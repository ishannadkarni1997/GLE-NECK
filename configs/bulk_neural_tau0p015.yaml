name: bulk_neural_tau0p015
system: bulk
description: Multi-point GLE-NECK model used for the bulk transport results.

aa_targets:
  thermostat: langevin-peculiar
  langevin_mode: solvent-yz
  drift_reference: solvent
  notes: Processed targets in data/processed are used to regenerate the figures. Raw trajectories are stored separately.

gle:
  dt_fs: 1.0
  l_max: 500
  memory_orig_interval: 10.0
  warmup_steps: 5000
  steps_per_loss: 5000
  drift_window: 1000

neck:
  kernel_model: asym_softmax_poly
  zero_field_gate: E^2
  poly_degree: 1
  kernel_tau_prior_ps: 0.015
  training_fields: [0.5, 1.0, 2.0]
  optimizer: adam
  epochs: 800

status:
  promoted: true
  caveat: Corrective memory decays faster than equilibrium memory. Drift-velocity agreement alone does not establish a unique microscopic kernel.
