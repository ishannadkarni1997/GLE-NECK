[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gleneck"
version = "0.1.0"
description = "Clean reproducibility code for GLE-NECK coarse-grained transport."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ishan Nadkarni"},
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
jax = [
  "jax",
  "jax-md",
  "dm-haiku",
  "optax",
  "flax",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gleneck-bulk-figures = "gleneck.bulk.figures:main"
gleneck-bulk-check = "gleneck.bulk.checks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
